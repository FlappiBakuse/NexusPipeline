name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: 构建 + 分层测试
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Playwright 依赖
        working-directory: tests/e2e
        run: npm ci

      - name: 运行 Unit + Component 测试
        run: dotnet test tests\NexusPipeline.Tests\NexusPipeline.Tests.csproj --nologo

      - name: 运行 Web Logic 测试
        shell: pwsh
        run: |
          $webTests = @(Get-ChildItem tests/web -Filter *.test.mjs -File | ForEach-Object { $_.FullName })
          if ($webTests.Count -eq 0) { throw "未找到 Web Logic 测试文件" }
          node --test $webTests

      - name: 检查文档一致性
        run: node --test tests\documentation\documentation-consistency.mjs

      - name: 检查 UI Smoke 脚本语法
        shell: pwsh
        run: Get-ChildItem tests/e2e/tests -Filter *.smoke.spec.mjs | ForEach-Object { node --check $_.FullName }

      - name: 发布构建（提权版；runner 以管理员运行，无需 UAC）
        run: .\build.cmd

      - name: 运行 Playwright UI Smoke
        shell: cmd
        working-directory: tests/e2e
        env:
          NEXUS_TIME_SCALE: "10"
        run: npx playwright test

  system-tests:
    name: Windows System Smoke
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 发布构建（提权版；runner 以管理员运行，无需 UAC）
        run: .\build.cmd

      - name: 运行完整 System Smoke
        shell: cmd
        env:
          NEXUS_SYSTEM_SMOKE_ELEVATED: "1"
          NEXUS_TIME_SCALE: "10"
        run: tests\system\run-system.cmd
