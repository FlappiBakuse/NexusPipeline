name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: 构建 + 分层测试
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检出官方插件仓库（UI Smoke 夹具）
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: main
          path: NexusPipeline-Plugins

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 创建 CI 普通权限账户
        shell: pwsh
        run: |
          $userName = "NexusCi-" + [Guid]::NewGuid().ToString("N").Substring(0, 8)
          $password = "Nxp-" + [Guid]::NewGuid().ToString("N") + "!"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $userName -Password $securePassword -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          Add-LocalGroupMember -Group "Users" -Member $userName
          $principal = [System.Security.Principal.NTAccount]::new($env:COMPUTERNAME, $userName).Value
          $grant = "$($principal):(OI)(CI)M"
          icacls "$env:GITHUB_WORKSPACE" /grant $grant /T /C /Q
          Write-Output "::add-mask::$password"
          "NEXUS_CI_TEST_USER=$userName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_CI_TEST_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_CI_TEST_DOMAIN=." | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建 Medium Integrity 测试启动器
        shell: cmd
        run: dotnet build tests\support\NexusPipeline.TestLauncher\NexusPipeline.TestLauncher.csproj -c Release --nologo

      - name: 安装 Playwright 依赖
        working-directory: tests/e2e
        shell: cmd
        run: npm ci

      - name: 默认门禁（Unit + Component + Web + Docs + Syntax + Build）
        shell: cmd
        run: dotnet tests\support\NexusPipeline.TestLauncher\bin\Release\net8.0\NexusPipeline.TestLauncher.dll node tests\run.mjs default

      - name: 运行 Playwright UI Smoke
        shell: cmd
        env:
          NEXUS_TIME_SCALE: "10"
        run: dotnet tests\support\NexusPipeline.TestLauncher\bin\Release\net8.0\NexusPipeline.TestLauncher.dll node tests\run.mjs ui

      - name: 清理 CI 普通权限账户
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:NEXUS_CI_TEST_USER) {
            Remove-LocalUser -Name $env:NEXUS_CI_TEST_USER -ErrorAction SilentlyContinue
          }

  system-tests:
    name: Windows System Smoke
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 创建 CI 普通权限账户
        shell: pwsh
        run: |
          $userName = "NexusCi-" + [Guid]::NewGuid().ToString("N").Substring(0, 8)
          $password = "Nxp-" + [Guid]::NewGuid().ToString("N") + "!"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $userName -Password $securePassword -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          Add-LocalGroupMember -Group "Users" -Member $userName
          $principal = [System.Security.Principal.NTAccount]::new($env:COMPUTERNAME, $userName).Value
          $grant = "$($principal):(OI)(CI)M"
          icacls "$env:GITHUB_WORKSPACE" /grant $grant /T /C /Q
          Write-Output "::add-mask::$password"
          "NEXUS_CI_TEST_USER=$userName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_CI_TEST_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXUS_CI_TEST_DOMAIN=." | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建 Medium Integrity 测试启动器
        shell: cmd
        run: dotnet build tests\support\NexusPipeline.TestLauncher\NexusPipeline.TestLauncher.csproj -c Release --nologo

      - name: 构建发布源
        shell: cmd
        run: node tests\run.mjs build

      - name: 运行完整 System Smoke
        shell: cmd
        env:
          NEXUS_TIME_SCALE: "10"
        run: dotnet tests\support\NexusPipeline.TestLauncher\bin\Release\net8.0\NexusPipeline.TestLauncher.dll node tests\run.mjs system

      - name: 清理 CI 普通权限账户
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:NEXUS_CI_TEST_USER) {
            Remove-LocalUser -Name $env:NEXUS_CI_TEST_USER -ErrorAction SilentlyContinue
          }
