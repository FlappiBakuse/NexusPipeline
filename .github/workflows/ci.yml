name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:17 UTC 全量回归，覆盖本轮改动未触及的 Gate。
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      plugins_ref:
        description: 官方插件候选完整 commit SHA；留空使用 plugins.lock.json
        required: false
        type: string
      test_host_acceptance:
        description: 运行 v0.16.6 Test Host 更新专属验收（真实 timeScale=1）
        required: false
        default: false
        type: boolean
      admin_execution_acceptance:
        description: 运行 v0.16.6 管理员 Execution 专属验收（真实 timeScale=1）
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # 影响域判定：见 tools/ci-domains.mjs（分组与触发路径的唯一来源）。
  # 改动未命中任何目录、包含共享路径（CI 工作流与影响域清单本身）或改动列表不可用时按全量门禁处理。
  changes:
    name: 影响域判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.domains.outputs.frontend }}
      host: ${{ steps.domains.outputs.host }}
      docs: ${{ steps.domains.outputs.docs }}
      plugin: ${{ steps.domains.outputs.plugin }}
      ui: ${{ steps.domains.outputs.ui }}
      system_runtime: ${{ steps.domains.outputs.system_runtime }}
      system_execution: ${{ steps.domains.outputs.system_execution }}
      system_emulator: ${{ steps.domains.outputs.system_emulator }}
      system_update: ${{ steps.domains.outputs.system_update }}
      plan_digest: ${{ steps.domains.outputs.plan_digest }}
      plan_valid: ${{ steps.domains.outputs.plan_valid }}
      counterpart_repository: ${{ steps.domains.outputs.counterpart_repository }}
      counterpart_sha: ${{ steps.domains.outputs.counterpart_sha }}
      source_digest: ${{ steps.domains.outputs.source_digest }}
      build_inputs_digest: ${{ steps.domains.outputs.build_inputs_digest }}
      execution_plan: ${{ steps.domains.outputs.execution_plan }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装治理解析器
        run: npm ci --prefix tools --no-audit --no-fund

      - name: 读取官方插件固定基线
        id: plugins-lock
        env:
          NEXUS_CANDIDATE_REF: ${{ inputs.plugins_ref }}
        run: node tools/ci-lock.mjs plugins.lock.json

      - name: 检出官方插件固定基线
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ steps.plugins-lock.outputs.ref }}
          path: NexusPipeline-Plugins
          fetch-depth: 1

      - name: 准备官方插件固定基线本地引用
        run: git -C NexusPipeline-Plugins branch --force main HEAD

      - name: 安装前端与官方插件测试依赖
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix NexusPipeline-Plugins --no-audit --no-fund

      - name: 校验影响域、结果汇总与前端边界
        run: node tests/run.mjs tooling

      - name: 计算影响域
        id: domains
        shell: pwsh
        env:
          NEXUS_CANDIDATE_REF: ${{ inputs.plugins_ref }}
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            node tools/ci-changes.mjs --base '${{ github.event.pull_request.base.sha }}' --head '${{ github.sha }}' --github-output "$env:GITHUB_OUTPUT"
          } elseif ('${{ github.event_name }}' -eq 'schedule' -or '${{ github.event_name }}' -eq 'workflow_dispatch') {
            node tools/ci-changes.mjs --all --github-output "$env:GITHUB_OUTPUT"
          } else {
            node tools/ci-changes.mjs --base '${{ github.event.before }}' --head '${{ github.sha }}' --github-output "$env:GITHUB_OUTPUT"
          }

  # Gate A：前端单元与静态构建，纯 Node 工具链。
  frontend-unit:
    name: Gate A 前端 Unit + Build
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_CI_MANIFEST: ${{ github.workspace }}/nexus-ci-frontend.json
      NEXUS_CI_JOB_ID: frontend-unit
      NEXUS_CI_MODE: ci
      NEXUS_CI_DOMAIN: frontend
      NEXUS_CI_HEAD_SHA: ${{ github.sha }}
      NEXUS_CI_REPOSITORY_SHA: ${{ github.sha }}
      NEXUS_CI_PLAN_DIGEST: ${{ needs.changes.outputs.plan_digest }}
      NEXUS_CI_EXECUTION_PLAN: ${{ needs.changes.outputs.execution_plan }}
      NEXUS_CI_COUNTERPART_REPOSITORY: ${{ needs.changes.outputs.counterpart_repository }}
      NEXUS_CI_COUNTERPART_SHA: ${{ needs.changes.outputs.counterpart_sha }}
      NEXUS_CI_SOURCE_DIGEST: ${{ needs.changes.outputs.source_digest }}
      NEXUS_CI_BUILD_INPUTS_DIGEST: ${{ needs.changes.outputs.build_inputs_digest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 类型检查 + Vitest + 静态构建
        env:
          NEXUS_CI_EXECUTION_PLAN: ${{ needs.changes.outputs.execution_plan }}
          NEXUS_CI_REPORT_DIR: ${{ runner.temp }}/nexus-ci-reports/frontend
        run: node tests/run.mjs frontend --affected

      - name: 上传前端原始测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-reports-frontend-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-ci-reports/frontend
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传前端 required summary manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-manifest-frontend-${{ github.run_id }}
          path: ${{ github.workspace }}/nexus-ci-frontend.json
          if-no-files-found: ignore
          retention-days: 7

  # Gate B：宿主 C# 单元与组件门禁；编译校验覆盖生产工程，测试工程随 dotnet test 一起编译。
  host-core:
    name: Gate B 宿主 Unit + Component
    needs: changes
    if: ${{ needs.changes.outputs.host == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEXUS_CI_MANIFEST: ${{ github.workspace }}\nexus-ci-host.json
      NEXUS_CI_JOB_ID: host-core
      NEXUS_CI_MODE: ci
      NEXUS_CI_DOMAIN: host
      NEXUS_CI_HEAD_SHA: ${{ github.sha }}
      NEXUS_CI_REPOSITORY_SHA: ${{ github.sha }}
      NEXUS_CI_PLAN_DIGEST: ${{ needs.changes.outputs.plan_digest }}
      NEXUS_CI_EXECUTION_PLAN: ${{ needs.changes.outputs.execution_plan }}
      NEXUS_CI_COUNTERPART_REPOSITORY: ${{ needs.changes.outputs.counterpart_repository }}
      NEXUS_CI_COUNTERPART_SHA: ${{ needs.changes.outputs.counterpart_sha }}
      NEXUS_CI_SOURCE_DIGEST: ${{ needs.changes.outputs.source_digest }}
      NEXUS_CI_BUILD_INPUTS_DIGEST: ${{ needs.changes.outputs.build_inputs_digest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 宿主编译校验
        id: host-build
        shell: pwsh
        run: dotnet build src\NexusPipeline.csproj -c Release --nologo

      - name: 宿主 Unit + Component
        shell: pwsh
        env:
          NEXUS_CI_EXECUTION_PLAN: ${{ needs.changes.outputs.execution_plan }}
          NEXUS_CI_BUILD_STATUS: ${{ steps.host-build.outcome }}
          NEXUS_CI_REPORT_DIR: ${{ runner.temp }}/nexus-ci-reports/host
        run: node tests\run.mjs unit --affected

      - name: 上传宿主原始测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-reports-host-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-ci-reports/host
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传宿主 required summary manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-manifest-host-${{ github.run_id }}
          path: ${{ github.workspace }}/nexus-ci-host.json
          if-no-files-found: ignore
          retention-days: 7

  # Gate C：文档与 i18n 一致性，只需要 Node。
  docs-i18n:
    name: Gate C 文档 + i18n
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_CI_MANIFEST: ${{ github.workspace }}/nexus-ci-docs.json
      NEXUS_CI_JOB_ID: docs-i18n
      NEXUS_CI_MODE: ci
      NEXUS_CI_DOMAIN: docs
      NEXUS_CI_HEAD_SHA: ${{ github.sha }}
      NEXUS_CI_REPOSITORY_SHA: ${{ github.sha }}
      NEXUS_CI_PLAN_DIGEST: ${{ needs.changes.outputs.plan_digest }}
      NEXUS_CI_EXECUTION_PLAN: ${{ needs.changes.outputs.execution_plan }}
      NEXUS_CI_COUNTERPART_REPOSITORY: ${{ needs.changes.outputs.counterpart_repository }}
      NEXUS_CI_COUNTERPART_SHA: ${{ needs.changes.outputs.counterpart_sha }}
      NEXUS_CI_SOURCE_DIGEST: ${{ needs.changes.outputs.source_digest }}
      NEXUS_CI_BUILD_INPUTS_DIGEST: ${{ needs.changes.outputs.build_inputs_digest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取官方插件固定基线
        id: plugins-lock
        env:
          NEXUS_CANDIDATE_REF: ${{ inputs.plugins_ref }}
        run: node tools/ci-lock.mjs plugins.lock.json

      - name: 检出官方插件文档交叉校验基线
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ steps.plugins-lock.outputs.ref }}
          path: NexusPipeline-Plugins
          fetch-depth: 1

      - name: 准备官方插件文档基线本地引用
        run: git -C NexusPipeline-Plugins branch --force main HEAD

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装治理工具依赖
        run: npm ci --prefix tools --no-audit --no-fund

      - name: 文档与 i18n 一致性
        env:
          NEXUS_CI_REPORT_DIR: ${{ runner.temp }}/nexus-ci-reports/docs
        run: node tests/run.mjs docs

      - name: 上传文档原始测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-reports-docs-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-ci-reports/docs
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传文档 required summary manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-manifest-docs-${{ github.run_id }}
          path: ${{ github.workspace }}/nexus-ci-docs.json
          if-no-files-found: ignore
          retention-days: 7

  # Gate D：宿主 Plugin API、公共 nxp-* 控件与官方插件 Frontend API 契约。
  plugin-contract:
    name: Gate D 插件契约
    needs: changes
    if: ${{ needs.changes.outputs.plugin == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEXUS_CI_MANIFEST: ${{ github.workspace }}\nexus-ci-plugin.json
      NEXUS_CI_JOB_ID: plugin-contract
      NEXUS_CI_MODE: ci
      NEXUS_CI_DOMAIN: plugin
      NEXUS_CI_HEAD_SHA: ${{ github.sha }}
      NEXUS_CI_REPOSITORY_SHA: ${{ github.sha }}
      NEXUS_CI_PLAN_DIGEST: ${{ needs.changes.outputs.plan_digest }}
      NEXUS_CI_EXECUTION_PLAN: ${{ needs.changes.outputs.execution_plan }}
      NEXUS_CI_COUNTERPART_REPOSITORY: ${{ needs.changes.outputs.counterpart_repository }}
      NEXUS_CI_COUNTERPART_SHA: ${{ needs.changes.outputs.counterpart_sha }}
      NEXUS_CI_SOURCE_DIGEST: ${{ needs.changes.outputs.source_digest }}
      NEXUS_CI_BUILD_INPUTS_DIGEST: ${{ needs.changes.outputs.build_inputs_digest }}
    steps:
      - name: 检出宿主代码
        uses: actions/checkout@v4

      - name: 读取官方插件固定基线
        id: plugins-lock
        env:
          NEXUS_CANDIDATE_REF: ${{ inputs.plugins_ref }}
        run: node tools/ci-lock.mjs plugins.lock.json

      - name: 检出官方插件仓库（Frontend API 契约夹具）
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ steps.plugins-lock.outputs.ref }}
          path: NexusPipeline-Plugins

      - name: 准备官方插件契约基线本地引用
        run: git -C NexusPipeline-Plugins branch --force main HEAD

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装前端与官方插件测试依赖
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix NexusPipeline-Plugins --no-audit --no-fund

      - name: 插件宿主契约（由 Gate B 覆盖时复用）
        if: needs.changes.outputs.host != 'true'
        env:
          NEXUS_CI_REPORT_DIR: ${{ runner.temp }}/nexus-ci-reports/plugin
        run: node tests/run.mjs unit --group plugins

      - name: 公共 UI 与桥接（由 Gate A 覆盖时复用）
        if: needs.changes.outputs.frontend != 'true'
        env:
          NEXUS_CI_REPORT_DIR: ${{ runner.temp }}/nexus-ci-reports/plugin
        run: node tests/run.mjs frontend --group ui --group bridge

      - name: 官方插件真实装配与源码布局契约
        env:
          NEXUS_OFFICIAL_PLUGINS_ROOT: ${{ github.workspace }}/NexusPipeline-Plugins
          NEXUS_CI_REPORT_DIR: ${{ runner.temp }}/nexus-ci-reports/plugin
        run: node tests/run.mjs contract

      - name: 上传插件原始测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-reports-plugin-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-ci-reports/plugin
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传插件 required summary manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-manifest-plugin-${{ github.run_id }}
          path: ${{ github.workspace }}/nexus-ci-plugin.json
          if-no-files-found: ignore
          retention-days: 7

  # Gate E：管理员 UI Smoke，保留完整性自检、NEXUS_TIME_SCALE 与失败产物上传。
  ui-smoke:
    name: Gate E 管理员 UI Smoke
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXUS_CI_MANIFEST: ${{ github.workspace }}\nexus-ci-ui.json
      NEXUS_CI_JOB_ID: ui-smoke
      NEXUS_CI_MODE: admin
      NEXUS_CI_DOMAIN: ui
      NEXUS_CI_HEAD_SHA: ${{ github.sha }}
      NEXUS_CI_REPOSITORY_SHA: ${{ github.sha }}
      NEXUS_CI_PLAN_DIGEST: ${{ needs.changes.outputs.plan_digest }}
      NEXUS_CI_EXECUTION_PLAN: ${{ needs.changes.outputs.execution_plan }}
      NEXUS_CI_COUNTERPART_REPOSITORY: ${{ needs.changes.outputs.counterpart_repository }}
      NEXUS_CI_COUNTERPART_SHA: ${{ needs.changes.outputs.counterpart_sha }}
      NEXUS_CI_SOURCE_DIGEST: ${{ needs.changes.outputs.source_digest }}
      NEXUS_CI_BUILD_INPUTS_DIGEST: ${{ needs.changes.outputs.build_inputs_digest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 管理员完整性自检
        shell: pwsh
        run: |
          $groups = & whoami /groups 2>&1
          $status = $LASTEXITCODE
          $text = ($groups -join "`n")
          Write-Output $text
          if ($status -ne 0 -or $text -notmatch 'S-1-16-(?:12288|16384)\b') {
            Write-Error "Windows runner 未处于 Administrator / High Integrity 或 System Integrity。"
            exit 2
          }
          Write-Output "[权限] 已确认 High/System Integrity。"

      - name: 安装 Playwright 依赖
        working-directory: tests/e2e
        shell: cmd
        run: npm ci

      - name: Administrator Playwright UI Smoke
        shell: cmd
        env:
          NEXUS_TIME_SCALE: "10"
          NEXUS_CI_REPORT_DIR: ${{ runner.temp }}/nexus-ci-reports/ui
        run: node tests\run.mjs admin ui

      - name: 上传 Playwright 失败诊断
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 UI 原始测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-reports-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-ci-reports/ui
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 UI required summary manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-manifest-ui-${{ github.run_id }}
          path: ${{ github.workspace }}/nexus-ci-ui.json
          if-no-files-found: ignore
          retention-days: 7

  # Gate F：System Runtime 按影响域拆成独立作业，各自调用 tests\run.mjs 的正式分域入口。
  system-runtime-mcp:
    name: Gate F System Runtime/MCP
    needs: changes
    if: ${{ needs.changes.outputs.system_runtime == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXUS_SYSTEM_WEB_PORT: "58831"
      NEXUS_CI_MANIFEST: ${{ github.workspace }}\nexus-ci-system-runtime.json
      NEXUS_CI_JOB_ID: system-runtime-mcp
      NEXUS_CI_MODE: admin
      NEXUS_CI_DOMAIN: system_runtime
      NEXUS_CI_HEAD_SHA: ${{ github.sha }}
      NEXUS_CI_REPOSITORY_SHA: ${{ github.sha }}
      NEXUS_CI_PLAN_DIGEST: ${{ needs.changes.outputs.plan_digest }}
      NEXUS_CI_EXECUTION_PLAN: ${{ needs.changes.outputs.execution_plan }}
      NEXUS_CI_COUNTERPART_REPOSITORY: ${{ needs.changes.outputs.counterpart_repository }}
      NEXUS_CI_COUNTERPART_SHA: ${{ needs.changes.outputs.counterpart_sha }}
      NEXUS_CI_SOURCE_DIGEST: ${{ needs.changes.outputs.source_digest }}
      NEXUS_CI_BUILD_INPUTS_DIGEST: ${{ needs.changes.outputs.build_inputs_digest }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取官方插件固定基线
        id: plugins-lock
        env:
          NEXUS_CANDIDATE_REF: ${{ inputs.plugins_ref }}
        run: node tools/ci-lock.mjs plugins.lock.json

      - name: 检出官方插件固定基线
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ steps.plugins-lock.outputs.ref }}
          path: NexusPipeline-Plugins
          fetch-depth: 1

      - name: 准备官方插件运行时基线本地引用
        run: git -C NexusPipeline-Plugins branch --force main HEAD

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 管理员完整性自检
        shell: pwsh
        run: |
          $groups = & whoami /groups 2>&1
          $status = $LASTEXITCODE
          $text = ($groups -join "`n")
          Write-Output $text
          if ($status -ne 0 -or $text -notmatch 'S-1-16-(?:12288|16384)\b') {
            Write-Error "Windows runner 未处于 Administrator / High Integrity 或 System Integrity。"
            exit 2
          }
          Write-Output "[权限] 已确认 High/System Integrity。"

      - name: Administrator System Smoke（Runtime / MCP）
        shell: cmd
        env:
          NEXUS_TIME_SCALE: "10"
          NEXUS_PLUGIN_REPO_ROOT: ${{ github.workspace }}/NexusPipeline-Plugins
          NEXUS_CI_REPORT_DIR: ${{ runner.temp }}/nexus-ci-reports/system-runtime
        run: node tests\run.mjs admin system --group runtime --group control --group config --group plugins

      - name: 上传 System Smoke 失败诊断
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: system-smoke-runtime-results
          path: |
            tests/system/runtime-*
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 System Runtime 原始测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-reports-system-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-ci-reports/system-runtime
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 System Runtime required summary manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-manifest-system-runtime-${{ github.run_id }}
          path: ${{ github.workspace }}/nexus-ci-system-runtime.json
          if-no-files-found: ignore
          retention-days: 7

  system-execution:
    name: Gate F System Execution
    needs: changes
    if: ${{ needs.changes.outputs.system_execution == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXUS_SYSTEM_WEB_PORT: "58832"
