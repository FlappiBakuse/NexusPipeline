name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: 构建 + 分层测试
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检出官方插件仓库（UI Smoke 夹具）
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: main
          path: NexusPipeline-Plugins

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Playwright 依赖
        working-directory: tests/e2e
        shell: cmd
        run: npm ci

      - name: 默认门禁（Unit + Component + Web + Docs + Syntax + Build）
        shell: cmd
        run: node tests\run.mjs default

      - name: 运行 Playwright UI Smoke
        shell: cmd
        env:
          NEXUS_TIME_SCALE: "10"
        run: node tests\run.mjs ui

  system-tests:
    name: Windows System Smoke
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 发布构建（提权版；runner 以管理员运行，无需 UAC）
        shell: cmd
        run: node tests\run.mjs build

      - name: 运行完整 System Smoke
        shell: cmd
        env:
          NEXUS_TIME_SCALE: "10"
        run: node tests\run.mjs system
