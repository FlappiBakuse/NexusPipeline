name: Host CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required:
    name: Host / Required
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify PR merge checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = '${{ github.sha }}'
          $parents = ((git show -s --format=%P HEAD).Trim() -split ' ')
          if ($actual -ne $expected -or $parents.Count -ne 2 -or
              $parents[0] -ne '${{ github.event.pull_request.base.sha }}' -or
              $parents[1] -ne '${{ github.event.pull_request.head.sha }}') {
            throw "PR merge checkout identity mismatch: $actual"
          }
          Write-Output "merge=$actual base=$($parents[0]) head=$($parents[1])"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Classify scope
        id: scope
        shell: pwsh
        run: node tools/ci-scope.mjs --mode fast --base '${{ github.event.pull_request.base.sha }}' --head '${{ github.sha }}' --github-output $env:GITHUB_OUTPUT
      - name: Resolve official Plugins source
        if: steps.scope.outputs.docs_only != 'true'
        id: plugins
        shell: pwsh
        run: |
          $line = @(git ls-remote https://github.com/FlappiBakuse/NexusPipeline-Plugins.git refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $line.Count -ne 1) { throw 'Cannot resolve official Plugins main' }
          $sha = ($line[0] -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid official Plugins SHA' }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "plugins=$sha"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.scope.outputs.docs_only != 'true'
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ steps.plugins.outputs.sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        if: steps.scope.outputs.docs_only != 'true'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.scope.outputs.docs_only != 'true'
        with:
          python-version: "3.13"
      - name: Run documentation checks
        if: steps.scope.outputs.docs_only == 'true'
        run: node tests/run.mjs docs
      - name: Run fast checks
        if: steps.scope.outputs.docs_only != 'true'
        env:
          NEXUS_OFFICIAL_PLUGINS_ROOT: ${{ github.workspace }}\NexusPipeline-Plugins
        run: node tests/run.mjs fast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-fast-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/runs/*/reports/**
          if-no-files-found: error
