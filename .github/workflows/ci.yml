name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: 构建 + 分层测试
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检出官方插件仓库（UI Smoke 夹具）
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: main
          path: NexusPipeline-Plugins

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建 Medium Integrity 测试启动器
        shell: cmd
        run: dotnet build tests\support\NexusPipeline.TestLauncher\NexusPipeline.TestLauncher.csproj -c Release --nologo

      - name: TestLauncher 权限与输出自检
        shell: cmd
        env:
          NEXUS_LAUNCHER_PROBE: expected-value
        run: dotnet tests\support\NexusPipeline.TestLauncher\bin\Release\net8.0\NexusPipeline.TestLauncher.dll node tests\support\launcher-probe.mjs

      - name: 安装 Playwright 依赖
        working-directory: tests/e2e
        shell: cmd
        run: npm ci

      - name: 默认门禁（Unit + Component + Web + Docs + Syntax + Build）
        shell: cmd
        run: dotnet tests\support\NexusPipeline.TestLauncher\bin\Release\net8.0\NexusPipeline.TestLauncher.dll node tests\run.mjs default

      - name: 运行 Playwright UI Smoke
        shell: cmd
        env:
          NEXUS_TIME_SCALE: "10"
        run: dotnet tests\support\NexusPipeline.TestLauncher\bin\Release\net8.0\NexusPipeline.TestLauncher.dll node tests\run.mjs ui

      - name: 上传 Playwright 失败诊断
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  system-tests:
    name: Windows System Smoke
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建 Medium Integrity 测试启动器
        shell: cmd
        run: dotnet build tests\support\NexusPipeline.TestLauncher\NexusPipeline.TestLauncher.csproj -c Release --nologo

      - name: TestLauncher 权限与输出自检
        shell: cmd
        env:
          NEXUS_LAUNCHER_PROBE: expected-value
        run: dotnet tests\support\NexusPipeline.TestLauncher\bin\Release\net8.0\NexusPipeline.TestLauncher.dll node tests\support\launcher-probe.mjs

      - name: 构建发布源
        shell: cmd
        run: node tests\run.mjs build

      - name: 运行完整 System Smoke
        shell: cmd
        env:
          NEXUS_TIME_SCALE: "10"
        run: dotnet tests\support\NexusPipeline.TestLauncher\bin\Release\net8.0\NexusPipeline.TestLauncher.dll node tests\run.mjs system
