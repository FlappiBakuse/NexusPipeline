name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: 构建 + e2e 测试
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装测试依赖
        working-directory: tests/e2e
        run: npm ci

      - name: 发布构建（提权版；runner 以管理员运行，无需 UAC）
        run: .\build.cmd

      - name: 运行单元测试（毫秒级，覆盖判定/解析/校验纯逻辑）
        run: dotnet test tests\NexusPipeline.Tests\NexusPipeline.Tests.csproj --nologo

      - name: 运行 e2e 测试（核心回归集，加速档）
        shell: cmd
        working-directory: tests/e2e
        env:
          NEXUS_CI: "1"
          NEXUS_TIME_SCALE: "10"
        run: npx playwright test

      - name: 上传诊断日志（e2e 失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            tests/e2e/runtime/logs/*.log
            tests/e2e/test-results/**
          retention-days: 7
