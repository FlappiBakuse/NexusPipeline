name: Host 持续集成
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
concurrency:
  group: Host-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  production-check:
    name: Host / 构建检查
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 检出完整源码与基线
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Source
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 Python 工具链
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 固定生产检查范围
        id: plan
        working-directory: Source
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/ci_check.py plan --base $env:PR_BASE_SHA --head $env:PR_HEAD_SHA --checkout $env:GITHUB_SHA --report "$env:RUNNER_TEMP/production-plan.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 检出固定对端生产输入
        if: steps.plan.outputs.partnerRequired == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ steps.plan.outputs.partnerSha }}
          path: Partner
          persist-credentials: false
      - name: 准备 Node 工具链
        if: steps.plan.outputs.nodeRequired == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: 准备 .NET 工具链
        if: steps.plan.outputs.dotnetRequired == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: Source/global.json
      - name: 执行生产检查
        working-directory: Source
        shell: pwsh
        run: |
          $arguments = @('tools/ci_check.py', 'run', '--plan', "$env:RUNNER_TEMP/production-plan.json", '--output', "$env:RUNNER_TEMP/production-check")
          if ('${{ steps.plan.outputs.partnerRequired }}' -eq 'true') { $arguments += @('--plugins-root', "$env:GITHUB_WORKSPACE/Partner") }
          python @arguments
          exit $LASTEXITCODE
      - name: 保存范围和生产检查证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-plan.json
            ${{ runner.temp }}/production-check/report.json
            ${{ runner.temp }}/production-check/*.json
            ${{ runner.temp }}/production-check/*.log
          if-no-files-found: error
          retention-days: 7
