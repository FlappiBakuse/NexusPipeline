name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: 构建 + e2e 测试
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装测试依赖
        working-directory: uitest
        run: npm ci

      - name: 发布构建（提权版；runner 以管理员运行，无需 UAC）
        run: .\build.cmd

      - name: 运行 e2e 测试（核心回归集）
        shell: cmd
        run: node uitest\test.mjs --ci
