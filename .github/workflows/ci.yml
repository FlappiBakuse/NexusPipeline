name: Host 持续集成
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  actions: read
concurrency:
  group: host-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    name: Host / 范围判定
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      control: ${{ steps.plan.outputs.control }}
      partnerSha: ${{ steps.plan.outputs.partnerSha }}
    steps:
      - name: 检出完整源码与基线
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Host
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: 准备配对输入工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 选择受影响门禁
        id: plan
        working-directory: Host
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCOPE_RESULT: ${{ runner.temp }}/scope.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/ci-scope.mjs
      - name: 保存范围计划
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scope.json
          if-no-files-found: error
          retention-days: 7
  control:
    name: Host / 控制检查
    needs: scope
    if: needs.scope.outputs.control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NEXUS_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-control
    steps:
      - name: 记录任务预算起点
        run: echo "NEXUS_TEST_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: 检出完整源码与基线
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Host
          fetch-depth: 0
          persist-credentials: false
      - name: 检出固定插件源码
        if: needs.scope.outputs.partnerSha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ needs.scope.outputs.partnerSha }}
          path: Plugins
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: 准备 Python 工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 下载范围计划
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scope
      - name: 执行选中控制检查
        working-directory: Host
        env:
          NEXUS_PARTNER_ROOT: ${{ needs.scope.outputs.partnerSha != '' && format('{0}/Plugins', github.workspace) || '' }}
        run: node tests/run.mjs batch --plan '${{ runner.temp }}/scope/scope.json' --batch control
      - name: 保存原生报告与清理证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-${{ github.run_id }}-${{ github.run_attempt }}-control
          path: |
            ${{ runner.temp }}/NexusPipeline.Tests/runs/${{ env.NEXUS_TEST_RUN_ID }}/batch-report.json
            ${{ runner.temp }}/NexusPipeline.Tests/runs/${{ env.NEXUS_TEST_RUN_ID }}/commands.log
            ${{ runner.temp }}/NexusPipeline.Tests/runs/${{ env.NEXUS_TEST_RUN_ID }}/evidence/
          if-no-files-found: error
          retention-days: 7
  batches:
    name: ${{ matrix.name || 'Host / 验证批次（未选中）' }}
    needs: scope
    if: needs.scope.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: windows-2025
    timeout-minutes: 3
    env:
      NEXUS_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
    steps:
      - name: 记录任务预算起点
        shell: pwsh
        run: '"NEXUS_TEST_JOB_STARTED_AT_MS=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())" >> $env:GITHUB_ENV'
      - name: 检出完整源码与基线
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Host
          fetch-depth: 0
          persist-credentials: false
      - name: 检出固定插件源码
        if: matrix.partnerRequired
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ needs.scope.outputs.partnerSha }}
          path: Plugins
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: 准备 Python 工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 准备 .NET 工具链
        if: matrix.dotnetRequired
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: 下载范围计划
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scope
      - name: 执行选中验证批次
        working-directory: Host
        shell: pwsh
        run: |
          $arguments = @('tests/run.mjs', 'batch', '--plan', "$env:RUNNER_TEMP/scope/scope.json", '--batch', '${{ matrix.id }}')
          if ('${{ matrix.partnerRequired }}' -eq 'true') { $arguments += @('--partner-root', "$env:GITHUB_WORKSPACE/Plugins") }
          node @arguments
      - name: 保存原生报告与清理证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/NexusPipeline.Tests/runs/${{ env.NEXUS_TEST_RUN_ID }}/batch-report.json
            ${{ runner.temp }}/NexusPipeline.Tests/runs/${{ env.NEXUS_TEST_RUN_ID }}/commands.log
            ${{ runner.temp }}/NexusPipeline.Tests/runs/${{ env.NEXUS_TEST_RUN_ID }}/evidence/
          if-no-files-found: error
          retention-days: 7
  required:
    name: Host / 必需汇总
    needs: [scope, control, batches]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 记录任务预算起点
        run: echo "NEXUS_TEST_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: 检出完整源码与基线
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Host
          fetch-depth: 0
          persist-credentials: false
      - name: 检出固定插件源码
        if: needs.scope.outputs.partnerSha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ needs.scope.outputs.partnerSha }}
          path: Plugins
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: 下载本次全部验证报告
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/reports
      - name: 核验门禁报告与完整任务预算
        working-directory: Host
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEXUS_PARTNER_ROOT: ${{ needs.scope.outputs.partnerSha != '' && format('{0}/Plugins', github.workspace) || '' }}
        run: python tests/gate-required.py . '${{ runner.temp }}/reports'
