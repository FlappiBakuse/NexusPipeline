name: Host Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved release tag to publish
        required: true
        type: string
      pr_number:
        description: Same-repository merged PR carrying the qualified source
        required: false
        type: string
      head_sha:
        description: Qualified PR head H
        required: false
        type: string
      base_sha:
        description: Historical qualification base B
        required: false
        type: string
      check_id:
        description: Host Release Qualification check id
        required: false
        type: string
      qualification_run_id:
        description: Completed Host Release Qualification run id
        required: false
        type: string
      candidate_run_id:
        description: Original successful Host candidate run ID for publish-only recovery
        required: false
        type: string
      candidate_artifact_id:
        description: Artifact ID if the original run has more than one successful candidate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: host-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and validate Host candidate
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: NexusPipeline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.424"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Resolve official Plugins input
        id: plugins
        shell: pwsh
        run: |
          $line = @(git ls-remote https://github.com/FlappiBakuse/NexusPipeline-Plugins.git refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $line.Count -ne 1) { throw 'Cannot resolve official Plugins main' }
          $sha = ($line[0] -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid official Plugins SHA' }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ steps.plugins.outputs.sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 0
          persist-credentials: false
      - name: Run merged-source integration
        working-directory: NexusPipeline
        env:
          NEXUS_OFFICIAL_PLUGINS_ROOT: ${{ github.workspace }}\NexusPipeline-Plugins
        run: node tests/run.mjs integration
      - name: Build and verify original candidate
        working-directory: NexusPipeline
        shell: pwsh
        env:
          PLUGIN_SHA: ${{ steps.plugins.outputs.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: >-
          python tools/host_release.py candidate
          --root . --source-sha $env:GITHUB_SHA
          --workflow-sha $env:WORKFLOW_SHA
          --partner-sha $env:PLUGIN_SHA
          --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT
          --frontend-ready
          --output .generated/candidate/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/tests/.artifacts/runs/*/reports/**
          if-no-files-found: warn
      - name: Upload validated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/candidate/${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error

  preflight:
    name: Verify approved tag and qualification
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_run_id == ''
    runs-on: ubuntu-latest
    environment: qualification-control
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      workflow_sha: ${{ steps.resolve.outputs.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Create qualification App token
        id: qualification-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.QUALIFICATION_APP_ID }}
          private-key: ${{ secrets.QUALIFICATION_APP_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
      - name: Verify tag and merged qualification
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          QUALIFICATION_TOKEN: ${{ steps.qualification-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          CHECK_ID: ${{ inputs.check_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_APP_ID: ${{ vars.QUALIFICATION_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_TAG" != *$'\n'*
          M="$(git -C NexusPipeline rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "${#M}" -eq 40
          export MERGED_SHA="$M"
          python -c 'import os,sys; sys.path.insert(0,"NexusPipeline/tools"); from pathlib import Path; from host_release import verify_tag; assert verify_tag(Path("NexusPipeline"), os.environ["RELEASE_TAG"]) == os.environ["MERGED_SHA"]'
          python NexusPipeline/tools/qualification_control.py verify-merged \
            --repository FlappiBakuse/NexusPipeline \
            --pr-number "$PR_NUMBER" \
            --merged-sha "$M" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --check-id "$CHECK_ID" \
            --app-id "$QUALIFICATION_APP_ID" \
            --run-id "$QUALIFICATION_RUN_ID" \
            --token-env QUALIFICATION_TOKEN
          echo "source_sha=$M" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$GITHUB_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build approved production package
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_run_id == ''
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: NexusPipeline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.workflow_sha }}
          path: release-controller
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.424"
      - name: Execute production build
        working-directory: NexusPipeline
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          PUBLISH_ROOT: .artifacts/publish/${{ github.run_id }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python ../release-controller/tools/host_release.py --root . --tag $env:RELEASE_TAG --source-sha $env:SOURCE_SHA --output $env:PUBLISH_ROOT --build
      - name: Upload package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-pipeline-${{ inputs.tag }}
          path: |
            NexusPipeline/.artifacts/publish/${{ github.run_id }}/NexusPipeline-*-win-x64.zip
            NexusPipeline/.artifacts/publish/${{ github.run_id }}/NexusPipeline-*-win-x64.zip.sha256
            NexusPipeline/.artifacts/publish/${{ github.run_id }}/build-metadata.json
          if-no-files-found: error

  publish:
    name: Publish approved release
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_run_id == ''
    needs: [preflight, build]
    runs-on: windows-latest
    environment: host-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.workflow_sha }}
          path: NexusPipeline
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nexus-pipeline-${{ inputs.tag }}
          path: NexusPipeline/.artifacts/publish/${{ github.run_id }}
      - name: Create qualification App token
        id: qualification-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.QUALIFICATION_APP_ID }}
          private-key: ${{ secrets.QUALIFICATION_APP_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
      - name: Re-verify qualification immediately before write
        shell: bash
        env:
          QUALIFICATION_TOKEN: ${{ steps.qualification-token.outputs.token }}
          GH_REPO: FlappiBakuse/NexusPipeline
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CHECK_ID: ${{ inputs.check_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_APP_ID: ${{ vars.QUALIFICATION_APP_ID }}
        run: >-
          python NexusPipeline/tools/qualification_control.py verify-merged
          --repository "$GH_REPO"
          --pr-number "$PR_NUMBER"
          --merged-sha "$SOURCE_SHA"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --check-id "$CHECK_ID"
          --app-id "$QUALIFICATION_APP_ID"
          --run-id "$QUALIFICATION_RUN_ID"
          --token-env QUALIFICATION_TOKEN
      - name: Create release publisher App token
        id: publisher-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.HOST_RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.HOST_RELEASE_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline
          permission-contents: write
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          GH_REPO: FlappiBakuse/NexusPipeline
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          PUBLISH_ROOT: NexusPipeline/.artifacts/publish/${{ github.run_id }}
        shell: bash
        run: bash NexusPipeline/tools/host_release_publish.sh

  publish-only:
    name: Publish original Host candidate
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != ''
    runs-on: windows-latest
    environment: host-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Resolve original successful producer and artifact
        id: source
        working-directory: NexusPipeline
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publisher control must run from main' }
          $arguments = @('--candidate-run-id', $env:CANDIDATE_RUN_ID, '--current-run-id', $env:GITHUB_RUN_ID, '--github-output', $env:GITHUB_OUTPUT)
          if ($env:CANDIDATE_ARTIFACT_ID) { $arguments += @('--artifact-id', $env:CANDIDATE_ARTIFACT_ID) }
          python tools/host_candidate_source.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Original candidate source was not verifiable' }
      - name: Download original artifact and verify bytes
        working-directory: NexusPipeline
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          New-Item -ItemType Directory -Path '.generated' -Force | Out-Null
          $uri = "https://api.github.com/repos/FlappiBakuse/NexusPipeline/actions/artifacts/$env:ARTIFACT_ID/zip"
          curl.exe -fsSL -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/octet-stream' --output '.generated/host-candidate-artifact.zip' $uri
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact download failed' }
          python tools/host_release.py extract-candidate --artifact-zip '.generated/host-candidate-artifact.zip' --expected-digest $env:ARTIFACT_DIGEST --output '.generated/host-candidate'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact failed server digest or path validation' }
      - name: Verify tag, source tree, producer and production package
        working-directory: NexusPipeline
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          WORKFLOW_SHA: ${{ steps.source.outputs.workflow_sha }}
          ORIGINAL_RUN_ID: ${{ steps.source.outputs.run_id }}
          ORIGINAL_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          python tools/host_release.py validate-candidate --root . --output '.generated/host-candidate' --tag $env:RELEASE_TAG --expected-source-sha $env:SOURCE_SHA --workflow-sha $env:WORKFLOW_SHA --run-id $env:ORIGINAL_RUN_ID --run-attempt $env:ORIGINAL_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'Original candidate failed independent validation' }
      - name: Create release publisher App token
        id: publisher-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.HOST_RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.HOST_RELEASE_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline
          permission-contents: write
      - name: Publish immutable package without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          GH_REPO: FlappiBakuse/NexusPipeline
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          PUBLISH_ROOT: NexusPipeline/.generated/host-candidate
        run: bash NexusPipeline/tools/host_release_publish.sh
