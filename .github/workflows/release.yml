name: Host 发布
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [candidate, publish-only]
        default: candidate
        required: true
      source_commit:
        description: 完整 Host main 来源 SHA
        type: string
      partner_commit:
        description: 完整 Plugins main 稳定来源 SHA
        type: string
      candidate_run_id:
        type: string
      candidate_artifact_id:
        type: string
      publish:
        description: 写入指定原候选
        type: boolean
        default: false
      generation:
        description: 签名商店 generation UUID
        type: string
      sequence:
        description: 签名商店递增序号
        type: string
      published_at:
        description: 已确认 UTC 发行时间
        type: string
permissions:
  contents: read
concurrency:
  group: host-release
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  candidate:
    name: Host / 候选校验
    if: github.ref == 'refs/heads/main' && inputs.operation == 'candidate'
    runs-on: windows-2025
    timeout-minutes: 60
    environment: host-release
    steps:
      - name: 校验候选参数
        shell: pwsh
        env:
          SOURCE: ${{ inputs.source_commit }}
          PARTNER: ${{ inputs.partner_commit }}
          RUN: ${{ inputs.candidate_run_id }}
          ARTIFACT: ${{ inputs.candidate_artifact_id }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          foreach ($value in @($env:SOURCE, $env:PARTNER)) {
            if ($value -cnotmatch '^[0-9a-f]{40}$') { throw 'Full source SHA required' }
          }
          if ($env:RUN -or $env:ARTIFACT -or $env:PUBLISH -eq 'true') { throw 'Candidate does not publish' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          path: Source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ inputs.partner_commit }}
          path: Partner
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - name: 构建固定生产候选
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_SIGNING_KEY: ${{ secrets.NEXUS_SIGNING_KEY }}
          SOURCE: ${{ inputs.source_commit }}
          PARTNER: ${{ inputs.partner_commit }}
          GENERATION: ${{ inputs.generation }}
          SEQUENCE: ${{ inputs.sequence }}
          PUBLISHED: ${{ inputs.published_at }}
          KEY_ID: ${{ vars.NEXUS_SIGNING_KEY_ID }}
          METADATA_ROOT: ${{ vars.NEXUS_METADATA_ROOT }}
          ARTIFACT_ROOT: ${{ vars.NEXUS_ARTIFACT_ROOT }}
        run: |
          python Control/tooling/release_build.py --source-root "$env:GITHUB_WORKSPACE/Source" --partner-root "$env:GITHUB_WORKSPACE/Partner" --source-commit $env:SOURCE --partner-commit $env:PARTNER --output "$env:RUNNER_TEMP/release" --key-id $env:KEY_ID --metadata-root $env:METADATA_ROOT --artifact-root $env:ARTIFACT_ROOT --generation $env:GENERATION --sequence $env:SEQUENCE --published-at $env:PUBLISHED
          exit $LASTEXITCODE
      - name: 保存原候选
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/candidate/
          if-no-files-found: error
          retention-days: 14
      - name: 保存构建证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/build.json
            ${{ runner.temp }}/release/*.log
          if-no-files-found: warn
  publisher:
    name: Host / 发布原候选
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish-only'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    environment: host-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 创建 Publisher App 令牌
        if: inputs.publish
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.HOST_RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.HOST_RELEASE_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline
          permission-contents: write
      - name: 验证并发布原候选
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.candidate_run_id }}
          ARTIFACT: ${{ inputs.candidate_artifact_id }}
          PUBLISH: ${{ inputs.publish }}
          SOURCE: ${{ inputs.source_commit }}
          PARTNER: ${{ inputs.partner_commit }}
          GENERATION: ${{ inputs.generation }}
          SEQUENCE: ${{ inputs.sequence }}
          PUBLISHED: ${{ inputs.published_at }}
          NEXUS_PUBLISHER_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          if ($env:SOURCE -or $env:PARTNER -or $env:GENERATION -or $env:SEQUENCE -or $env:PUBLISHED) { throw 'Writer accepts original candidate identities only' }
          if ($env:RUN -notmatch '^[1-9][0-9]*$') { throw 'Original run ID required' }
          $arguments = @('Control/tooling/release_check.py', 'publish-only', '--kind', 'host', '--run-id', $env:RUN, '--writer-id', $env:GITHUB_RUN_ID, '--output', "$env:RUNNER_TEMP/publication")
          if ($env:ARTIFACT) {
            if ($env:ARTIFACT -notmatch '^[1-9][0-9]*$') { throw 'Invalid artifact ID' }
            $arguments += @('--artifact-id', $env:ARTIFACT)
          }
          if ($env:PUBLISH -eq 'true') { $arguments += '--publish' }
          python @arguments
          exit $LASTEXITCODE
      - name: 保存发布回执
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication/provenance.json
            ${{ runner.temp }}/publication/result.json
          if-no-files-found: warn
