name: Host Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only candidate build or publish an existing candidate
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - publish-only
      source_ref:
        description: Main-reachable source commit/ref for candidate mode
        required: false
        default: main
        type: string
      tag:
        description: Existing approved release tag (publish-only only)
        required: false
        type: string
      candidate_run_id:
        description: Original successful Host candidate run ID for publish-only recovery
        required: false
        type: string
      candidate_artifact_id:
        description: Artifact ID if the original run has more than one successful candidate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: host-release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  source-plan:
    name: Host / 候选输入
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate')
    runs-on: windows-latest
    timeout-minutes: 3
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      partner_sha: ${{ steps.plugins.outputs.sha }}
    steps:
      - name: 校验候选操作参数
        shell: pwsh
        env:
          OPERATION: ${{ inputs.operation || 'candidate' }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Candidate controller must run from main' }
          if ($env:OPERATION -ne 'candidate' -or -not $env:SOURCE_REF) { throw 'Invalid candidate operation or source_ref' }
          if ($env:CANDIDATE_RUN_ID -or $env:CANDIDATE_ARTIFACT_ID -or $env:RELEASE_TAG) { throw 'candidate mode does not accept publish-only inputs' }
      - name: 检出候选源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
          path: NexusPipeline
          fetch-depth: 0
          persist-credentials: false
      - name: 固定受保护源码
        id: source
        working-directory: NexusPipeline
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve protected main' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source is not reachable from main' }
          "sha=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT
      - name: 固定官方插件输入
        id: plugins
        shell: pwsh
        run: |
          $line = @(git ls-remote https://github.com/FlappiBakuse/NexusPipeline-Plugins.git refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $line.Count -ne 1) { throw 'Cannot resolve official Plugins main' }
          $sha = ($line[0] -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid official Plugins SHA' }
          "sha=$sha" >> $env:GITHUB_OUTPUT

  production-frontend:
    name: Host / 生产前端
    needs: source-plan
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: 检出候选控制源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Control
          persist-credentials: false
      - name: 检出固定宿主源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-plan.outputs.source_sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: 准备Node工具链
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: 准备Python工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 构建生产前端并记录字节
        working-directory: NexusPipeline
        shell: pwsh
        run: python ../NexusPipeline-Control/tools/host_release.py build-frontend --root . --source-sha '${{ needs.source-plan.outputs.source_sha }}' --output .generated/frontend-phase
      - name: 上传前端阶段产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/frontend-phase/
          include-hidden-files: true
          if-no-files-found: error

  bundled-plugin-build:
    name: Host / 预装插件
    needs: source-plan
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: 检出候选控制源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Control
          persist-credentials: false
      - name: 检出固定宿主源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-plan.outputs.source_sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: 检出固定插件源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ needs.source-plan.outputs.partner_sha }}
          path: NexusPipeline-Plugins
          persist-credentials: false
      - name: 准备Python工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 验证预装插件包并记录字节
        working-directory: NexusPipeline
        shell: pwsh
        run: >-
          python ../NexusPipeline-Control/tools/host_release.py build-bundled --root .
          --source-sha '${{ needs.source-plan.outputs.source_sha }}'
          --partner-sha '${{ needs.source-plan.outputs.partner_sha }}'
          --plugins-root ../NexusPipeline-Plugins --output .generated/bundled-phase
      - name: 上传预装插件阶段产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-bundled-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/bundled-phase/
          include-hidden-files: true
          if-no-files-found: error

  production-host:
    name: Host / 生产宿主
    needs: [source-plan, production-frontend, bundled-plugin-build]
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: 检出候选控制源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Control
          persist-credentials: false
      - name: 检出固定宿主源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-plan.outputs.source_sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: 准备Node工具链
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: 准备.NET工具链
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.424"
      - name: 准备Python工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 下载前端阶段产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/frontend-phase
      - name: 下载预装插件阶段产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-bundled-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/bundled-phase
      - name: 验证阶段输入并构建生产宿主
        working-directory: NexusPipeline
        shell: pwsh
        run: >-
          python ../NexusPipeline-Control/tools/host_release.py build-host --root .
          --source-sha '${{ needs.source-plan.outputs.source_sha }}'
          --partner-sha '${{ needs.source-plan.outputs.partner_sha }}'
          --frontend-phase .generated/frontend-phase
          --bundled-phase .generated/bundled-phase
          --output .generated/host-phase
      - name: 上传生产宿主阶段产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/host-phase/
          include-hidden-files: true
          if-no-files-found: error

  package-verify:
    name: Host / 包校验
    needs: [source-plan, production-host]
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: 检出候选控制源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Control
          persist-credentials: false
      - name: 检出固定宿主源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-plan.outputs.source_sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: 准备Python工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 下载生产宿主阶段产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/host-phase
      - name: 核验生产包字节
        working-directory: NexusPipeline
        shell: pwsh
        run: |
          $meta = Get-Content .generated/host-phase/build-metadata.json -Raw | ConvertFrom-Json
          $package = ".generated/host-phase/NexusPipeline-$($meta.tag)-win-x64.zip"
          python ../NexusPipeline-Control/tools/host_release.py verify-package --package $package --metadata .generated/host-phase/build-metadata.json --expected-source-sha '${{ needs.source-plan.outputs.source_sha }}' --expected-tag $meta.tag
          if ($LASTEXITCODE -ne 0) { throw 'Production package failed validation' }

  installer-build:
    name: Host / 安装器构建
    needs: [source-plan, production-host]
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: 检出候选控制源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Control
          persist-credentials: false
      - name: 检出固定宿主源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-plan.outputs.source_sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: 准备Python工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 下载生产宿主阶段产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/host-phase
      - name: 准备锁定安装工具
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:GITHUB_WORKSPACE 'inno-tool'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          $package = Join-Path $toolRoot 'innosetup-6.7.3.exe'
          curl.exe -fsSL --connect-timeout 10 --max-time 120 --retry 2 --output $package 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup download failed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup distribution digest mismatch' }
          $compilerDir = Join-Path $toolRoot 'compiler'
          $process = Start-Process -FilePath $package -ArgumentList @('/PORTABLE=1', "/DIR=$compilerDir", '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup portable extraction failed: $($process.ExitCode)" }
          $compiler = Join-Path $compilerDir 'ISCC.exe'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $compiler).Hash.ToLowerInvariant() -ne '0a8757031b33777e4c9cbffee40f11a5062b36d25cbe144c1db73b6102b80ad7') { throw 'Inno compiler digest mismatch' }
      - name: 构建同源安装器
        working-directory: NexusPipeline
        shell: pwsh
        run: >-
          python ../NexusPipeline-Control/tools/host_installer.py --production-root .generated/host-phase/production
          --metadata .generated/host-phase/build-metadata.json
          --dependencies tools/runtime-dependencies.json
          --template tools/installer.iss.in
          --compiler ../inno-tool/compiler/ISCC.exe
          --output .generated/installer-phase
      - name: 上传安装器阶段产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/installer-phase/
          include-hidden-files: true
          if-no-files-found: error

  candidate:
    name: Host / 候选校验
    needs: [source-plan, package-verify, installer-build]
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: 检出候选控制源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Control
          persist-credentials: false
      - name: 检出固定宿主源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source-plan.outputs.source_sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: 准备Python工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 下载生产宿主阶段产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/host-phase
      - name: 下载安装器阶段产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/installer-phase
      - name: 汇集并核验原始候选
        working-directory: NexusPipeline
        shell: pwsh
        run: >-
          python ../NexusPipeline-Control/tools/host_release.py assemble-candidate --root .
          --source-sha '${{ needs.source-plan.outputs.source_sha }}'
          --partner-sha '${{ needs.source-plan.outputs.partner_sha }}'
          --workflow-sha '${{ github.workflow_sha }}'
          --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}'
          --host-phase .generated/host-phase --installer-phase .generated/installer-phase
          --output .generated/candidate/${{ github.run_id }}-${{ github.run_attempt }}
      - name: 上传原始候选
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline/.generated/candidate/${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error

  publish-only:
    name: Host / 原包发布
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-only'
    runs-on: windows-latest
    timeout-minutes: 3
    environment: host-release
    permissions:
      actions: read
      contents: read
    steps:
      - name: 检出发布控制源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline
          fetch-depth: 0
          persist-credentials: false
      - name: 准备Python工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Resolve original successful producer and artifact
        id: source
        working-directory: NexusPipeline
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publisher control must run from main' }
          if (-not $env:CANDIDATE_RUN_ID) { throw 'publish-only requires candidate_run_id' }
          if (-not '${{ inputs.tag }}') { throw 'publish-only requires an existing tag' }
          $arguments = @('--candidate-run-id', $env:CANDIDATE_RUN_ID, '--current-run-id', $env:GITHUB_RUN_ID, '--github-output', $env:GITHUB_OUTPUT)
          if ($env:CANDIDATE_ARTIFACT_ID) { $arguments += @('--artifact-id', $env:CANDIDATE_ARTIFACT_ID) }
          python tools/host_candidate_source.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Original candidate source was not verifiable' }
      - name: Download original artifact and verify bytes
        working-directory: NexusPipeline
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          New-Item -ItemType Directory -Path '.generated' -Force | Out-Null
          $uri = "https://api.github.com/repos/FlappiBakuse/NexusPipeline/actions/artifacts/$env:ARTIFACT_ID/zip"
          curl.exe -fsSL --connect-timeout 10 --max-time 60 --retry 2 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' --output '.generated/host-candidate-artifact.zip' $uri
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact download failed' }
          python tools/host_release.py extract-candidate --artifact-zip '.generated/host-candidate-artifact.zip' --expected-digest $env:ARTIFACT_DIGEST --output '.generated/host-candidate'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact failed server digest or path validation' }
      - name: Inspect original candidate identity before source checkout
        id: candidate
        working-directory: NexusPipeline
        shell: pwsh
        run: >-
          python tools/host_release.py inspect-candidate
          --output '.generated/host-candidate'
          --workflow-sha '${{ steps.source.outputs.workflow_sha }}'
          --run-id '${{ steps.source.outputs.run_id }}'
          --run-attempt '${{ steps.source.outputs.run_attempt }}'
          --github-output $env:GITHUB_OUTPUT
      - name: 检出原始候选源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          path: NexusPipeline-Source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, source tree, producer and production package
        working-directory: NexusPipeline
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          WORKFLOW_SHA: ${{ steps.source.outputs.workflow_sha }}
          ORIGINAL_RUN_ID: ${{ steps.source.outputs.run_id }}
          ORIGINAL_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          python tools/host_release.py validate-candidate --root ../NexusPipeline-Source --output '.generated/host-candidate' --tag $env:RELEASE_TAG --expected-source-sha $env:SOURCE_SHA --workflow-sha $env:WORKFLOW_SHA --run-id $env:ORIGINAL_RUN_ID --run-attempt $env:ORIGINAL_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'Original candidate failed independent validation' }
      - name: Create release publisher App token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.HOST_RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.HOST_RELEASE_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline
          permission-contents: write
      - name: Publish immutable package without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          GH_REPO: FlappiBakuse/NexusPipeline
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          PUBLISH_ROOT: NexusPipeline/.generated/host-candidate
        run: bash NexusPipeline/tools/host_release_publish.sh
