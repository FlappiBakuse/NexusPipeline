name: Host Final Budget

on:
  workflow_run:
    workflows: [Host CI, Host 持续集成]
    types: [requested, completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Host CI run to audit
        required: true
        type: string
      attempt:
        description: Completed attempt
        required: true
        type: string
      phase:
        description: Register a complete rerun attempt or finalize its completed producer
        required: true
        default: finalize
        type: choice
        options: [begin, finalize]

permissions:
  actions: read
  checks: write
  contents: read

concurrency:
  group: host-final-budget-controller
  cancel-in-progress: false

jobs:
  audit:
    name: Host / 完整预算回写
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 检出受信控制器
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: 准备 Python 工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 审计完整运行并发布最终检查
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.attempt }}
          PHASE: ${{ github.event.action == 'requested' && 'begin' || inputs.phase || 'finalize' }}
        run: python tests/final-budget.py --phase "$PHASE" --run-id "$RUN_ID" --attempt "$ATTEMPT" --required-name 'Host / Required' --check-name 'Host / Final Budget'
