name: Release Qualification

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR number targeting main
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head SHA H
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: host-release-qualification-${{ inputs.expected_head_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: qualification-preflight
    runs-on: ubuntu-latest
    environment: qualification-control
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      workflow_sha: ${{ steps.resolve.outputs.workflow_sha }}
      contract_sha: ${{ steps.resolve.outputs.contract_sha }}
      check_id: ${{ steps.resolve.outputs.check_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Create qualification App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.QUALIFICATION_APP_ID }}
          private-key: ${{ secrets.QUALIFICATION_APP_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Resolve official Plugins contract input and start App check
        id: resolve
        env:
          QUALIFICATION_TOKEN: ${{ steps.app-token.outputs.token }}
          QUALIFICATION_APP_ID: ${{ vars.QUALIFICATION_APP_ID }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          C="$GITHUB_WORKFLOW_SHA"
          python tools/qualification_control.py preflight \
            --pr-number "$PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --workflow-sha "$C" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --app-id "$QUALIFICATION_APP_ID" > preflight.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("preflight.json", encoding="utf-8") as stream:
              value = json.load(stream)
          print(f"head_sha={value['headSha']}")
          print(f"base_sha={value['baseSha']}")
          print(f"workflow_sha={value['workflowSha']}")
          print(f"contract_sha={value['contractSourceSha']}")
          print(f"check_id={value['checkId']}")
          PY

  H1:
    name: H1
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ needs.preflight.outputs.contract_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.424"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Execute gate
        run: node tests/run.mjs release core
        env:
          NEXUS_OFFICIAL_PLUGINS_ROOT: ${{ github.workspace }}\NexusPipeline-Plugins
      - name: Preserve native gate reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-H1-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/runs/*/reports/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  H2:
    name: H2
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ needs.preflight.outputs.contract_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.424"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Execute gate
        env:
          NEXUS_OFFICIAL_PLUGINS_ROOT: ${{ github.workspace }}\NexusPipeline-Plugins
        run: node tests/run.mjs release frontend-contract
      - name: Preserve native gate reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-H2-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/runs/*/reports/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  H3:
    name: H3
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline-Plugins
          ref: ${{ needs.preflight.outputs.contract_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.424"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Execute gate
        run: node tests/run.mjs release ui-runtime
        env:
          NEXUS_OFFICIAL_PLUGINS_ROOT: ${{ github.workspace }}\NexusPipeline-Plugins
      - name: Preserve native gate reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-H3-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/runs/*/reports/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  H4:
    name: H4
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.424"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Execute gate
        run: node tests/run.mjs release execution-emulator
      - name: Preserve native gate reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-H4-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/runs/*/reports/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  H5:
    name: H5
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.424"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Execute gate
        run: node tests/run.mjs release update-acceptance
      - name: Preserve native gate reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-H5-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/runs/*/reports/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  qualification-result:
    name: qualification-result
    if: ${{ always() && needs.preflight.result == 'success' }}
    needs: [preflight, H1, H2, H3, H4, H5]
    runs-on: ubuntu-latest
    environment: qualification-control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Create qualification App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.QUALIFICATION_APP_ID }}
          private-key: ${{ secrets.QUALIFICATION_APP_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline
          permission-actions: read
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Finish external App check
        env:
          QUALIFICATION_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python tools/qualification_control.py finish
          --pr-number "${{ inputs.pr_number }}"
          --head-sha "${{ needs.preflight.outputs.head_sha }}"
          --base-sha "${{ needs.preflight.outputs.base_sha }}"
          --workflow-sha "${{ needs.preflight.outputs.workflow_sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --check-id "${{ needs.preflight.outputs.check_id }}"
          --app-id "${{ vars.QUALIFICATION_APP_ID }}"
          --sdk-source-sha ""
          --contract-source-sha "${{ needs.preflight.outputs.contract_sha }}"
          --workflow-path ".github/workflows/release-qualification.yml"
