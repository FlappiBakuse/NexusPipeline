name: Feature request
description: 提议新的产品能力或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 请说明当前遇到的问题、使用对象和触发条件。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 请描述期望的用户行为和交互结果。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性影响
      description: 请说明对现有 API、配置、插件、运行时数据或测试的影响。
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: 信息确认
      options:
        - label: 我没有在 Issue 中包含 token、密钥、用户配置或未脱敏日志。
          required: true
